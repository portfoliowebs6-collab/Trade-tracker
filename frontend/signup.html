<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Kewa AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-container">
        <!-- Logo -->
        <div class="logo-box">K</div>
        <div class="text-center" style="margin-bottom: 20px;">
            <h1 style="font-size: 22px; font-weight: bold;">Kewa <span class="text-cyan">AI</span></h1>
            <p class="text-muted" style="margin-top: 4px;">Build &bull; Create &bull; Grow</p>
        </div>

        <div style="margin-bottom: 15px;">
            <h2 style="font-size: 18px; font-weight: bold;">Create <span class="text-blue">Account</span></h2>
            <p class="text-muted">Join us and start your journey</p>
        </div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <!-- Full Name -->
            <div class="input-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="signupName" class="custom-input" placeholder="Enter your full name" required>
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="signupEmail" class="custom-input" placeholder="you@example.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Create Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupPassword" class="custom-input" placeholder="Minimum 8 characters" required style="padding-right: 40px;">
                    <i class="fa-regular fa-eye-slash toggle-pass" onclick="togglePassword('signupPassword', this)"></i>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="signupConfirmPassword" class="custom-input" placeholder="Re-enter your password" required style="padding-right: 40px;">
                    <i class="fa-regular fa-eye-slash toggle-pass" onclick="togglePassword('signupConfirmPassword', this)"></i>
                </div>
            </div>

            <!-- Terms -->
            <div class="flex-row" style="margin-top: 12px;">
                <label class="checkbox-container" style="font-size: 11px;">
                    <input type="checkbox" required style="accent-color: #3b82f6;"> I agree to the <a href="#" style="color:#3b82f6;">Terms</a> & <a href="#" style="color:#3b82f6;">Privacy Policy</a>
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-glow">
                <span>CREATE ACCOUNT</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="auth.js"></script>
</body>
</html>
